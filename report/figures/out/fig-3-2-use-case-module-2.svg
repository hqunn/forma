<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 724" width="1000" height="724">
  <style>
  text { font-family: Segoe UI, Calibri, Helvetica Neue, Arial, sans-serif; fill: #16323D; }
  .t    { font-size: 15px; }
  .tb   { font-size: 15px; font-weight: 600; }
  .s    { font-size: 12.5px; fill: #4A646F; }
  .sb   { font-size: 12.5px; font-weight: 600; fill: #4A646F; }
  .e    { font-size: 12.5px; fill: #4A646F; }
  .h    { font-size: 16px; font-weight: 600; }
  .m    { font-family: Consolas, DejaVu Sans Mono, Courier New, monospace; font-size: 12.5px; }
  .mb   { font-family: Consolas, DejaVu Sans Mono, Courier New, monospace; font-size: 12.5px; font-weight: 600; }
  .cap  { font-size: 12.5px; fill: #4A646F; font-style: italic; }
  .box  { fill: #F2F7F9;  stroke: #16323D;    stroke-width: 1.4; }
  .boxw { fill: #FDF0EB;  stroke: #E8663C;  stroke-width: 1.4; }
  .boxp { fill: #FFFFFF; stroke: #16323D;    stroke-width: 1.4; }
  .boxq { fill: #FFFFFF; stroke: #C7D6DC;   stroke-width: 1.4; }
  .boxd { fill: none;    stroke: #4A646F;  stroke-width: 1.2; stroke-dasharray: 5 4; }
  .boxk { fill: #16323D;   stroke: #16323D;    stroke-width: 1.4; }
  .reg  { fill: none;    stroke: #C7D6DC;   stroke-width: 1.2; }
  .ln   { stroke: #16323D;   stroke-width: 1.4; fill: none; }
  .lnm  { stroke: #4A646F; stroke-width: 1.2; fill: none; }
  .lnh  { stroke: #C7D6DC;  stroke-width: 1.2; fill: none; }
  .lna  { stroke: #E8663C; stroke-width: 1.6; fill: none; }
  .lnd  { stroke: #4A646F; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  .life { stroke: #C7D6DC;  stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#16323D"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4A646F"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#E8663C"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5,0.8 L10,5 L0.5,9.2" fill="none" stroke="#4A646F" stroke-width="1.5"/></marker>
    <marker id="tri" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0.5,0.6 L10,5 L0.5,9.4 z" fill="#FFFFFF" stroke="#16323D" stroke-width="1.2"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="724" fill="#FFFFFF"/>
  <rect x="250" y="64" width="500" height="590" rx="8" class="reg"/>
  <text x="500" y="92" class="h" text-anchor="middle">FORMA mobile application</text>
  <text x="500" y="112" class="s" text-anchor="middle">Module 2: History and profile</text>
  <g stroke="#16323D" stroke-width="1.5" fill="none">
    <circle cx="130" cy="356.0" r="8.0" fill="#FFFFFF"/>
    <line x1="130" y1="364.0" x2="130" y2="388.0"/>
    <line x1="117.0" y1="372.0" x2="143.0" y2="372.0"/>
    <line x1="130" y1="388.0" x2="119.0" y2="406.0"/>
    <line x1="130" y1="388.0" x2="141.0" y2="406.0"/>
  </g>
  <text x="130" y="424.0" class="tb" text-anchor="middle"></text>
  <text x="130" y="458" class="tb" text-anchor="middle">Trainee</text>
  <rect x="800" y="350" width="160" height="76" rx="3" class="boxp"/>
  <text x="880.0" y="380" class="s" text-anchor="middle">«actor»</text>
  <text x="880.0" y="404" class="tb" text-anchor="middle">FORMA server</text>
  <line x1="130" y1="388" x2="440.2" y2="206.9" class="lnm"/>
  <line x1="130" y1="388" x2="411.5" y2="305.8" class="lnm"/>
  <line x1="130" y1="388" x2="386.0" y2="388.0" class="lnm"/>
  <line x1="130" y1="388" x2="411.5" y2="470.2" class="lnm"/>
  <line x1="800" y1="388.0" x2="550.9" y2="208.7" class="lnm"/>
  <line x1="800" y1="388.0" x2="550.9" y2="567.3" class="lnm"/>
  <ellipse cx="500" cy="172" rx="114" ry="41" class="boxp"/>
  <text x="500" y="156" class="sb" text-anchor="middle">UC-06</text>
  <text x="500" y="174" class="tb" text-anchor="middle">Sign in or</text>
  <text x="500" y="192" class="tb" text-anchor="middle">create an account</text>
  <ellipse cx="500" cy="280" rx="114" ry="41" class="boxp"/>
  <text x="500" y="272" class="sb" text-anchor="middle">UC-07</text>
  <text x="500" y="292" class="tb" text-anchor="middle">Browse session history</text>
  <ellipse cx="500" cy="388" rx="114" ry="41" class="boxp"/>
  <text x="500" y="380" class="sb" text-anchor="middle">UC-08</text>
  <text x="500" y="400" class="tb" text-anchor="middle">View a session in detail</text>
  <ellipse cx="500" cy="496" rx="114" ry="41" class="boxp"/>
  <text x="500" y="488" class="sb" text-anchor="middle">UC-09</text>
  <text x="500" y="508" class="tb" text-anchor="middle">Delete a session</text>
  <ellipse cx="500" cy="604" rx="114" ry="41" class="boxp"/>
  <text x="500" y="588" class="sb" text-anchor="middle">UC-10</text>
  <text x="500" y="606" class="tb" text-anchor="middle">Synchronise with</text>
  <text x="500" y="624" class="tb" text-anchor="middle">the profile</text>
  <text x="250" y="686" class="cap" text-anchor="start">The server is drawn as a classifier with the «actor» keyword because the subject of the diagram is the application, not the whole</text>
  <text x="250" y="704" class="cap" text-anchor="start">product. UC-07 to UC-09 reach no actor but the trainee: history is readable, and deletable, with no account and no connection.</text>

</svg>
