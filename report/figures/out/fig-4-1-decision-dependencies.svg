<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 684" width="1000" height="684">
  <style>
  text { font-family: Segoe UI, Calibri, Helvetica Neue, Arial, sans-serif; fill: #16323D; }
  .t    { font-size: 15px; }
  .tb   { font-size: 15px; font-weight: 600; }
  .s    { font-size: 12.5px; fill: #4A646F; }
  .sb   { font-size: 12.5px; font-weight: 600; fill: #4A646F; }
  .e    { font-size: 12.5px; fill: #4A646F; }
  .h    { font-size: 16px; font-weight: 600; }
  .m    { font-family: Consolas, DejaVu Sans Mono, Courier New, monospace; font-size: 12.5px; }
  .mb   { font-family: Consolas, DejaVu Sans Mono, Courier New, monospace; font-size: 12.5px; font-weight: 600; }
  .cap  { font-size: 12.5px; fill: #4A646F; font-style: italic; }
  .box  { fill: #F2F7F9;  stroke: #16323D;    stroke-width: 1.4; }
  .boxw { fill: #FDF0EB;  stroke: #E8663C;  stroke-width: 1.4; }
  .boxp { fill: #FFFFFF; stroke: #16323D;    stroke-width: 1.4; }
  .boxq { fill: #FFFFFF; stroke: #C7D6DC;   stroke-width: 1.4; }
  .boxd { fill: none;    stroke: #4A646F;  stroke-width: 1.2; stroke-dasharray: 5 4; }
  .boxk { fill: #16323D;   stroke: #16323D;    stroke-width: 1.4; }
  .reg  { fill: none;    stroke: #C7D6DC;   stroke-width: 1.2; }
  .ln   { stroke: #16323D;   stroke-width: 1.4; fill: none; }
  .lnm  { stroke: #4A646F; stroke-width: 1.2; fill: none; }
  .lnh  { stroke: #C7D6DC;  stroke-width: 1.2; fill: none; }
  .lna  { stroke: #E8663C; stroke-width: 1.6; fill: none; }
  .lnd  { stroke: #4A646F; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  .life { stroke: #C7D6DC;  stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#16323D"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4A646F"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#E8663C"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5,0.8 L10,5 L0.5,9.2" fill="none" stroke="#4A646F" stroke-width="1.5"/></marker>
    <marker id="tri" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0.5,0.6 L10,5 L0.5,9.4 z" fill="#FFFFFF" stroke="#16323D" stroke-width="1.2"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="684" fill="#FFFFFF"/>
  <path d="M 84 79 L 42 79 L 42 411 L 80 411" class="lnm" marker-end="url(#am)"/>
  <path d="M 774 245 L 940 245 L 940 577 L 540 577" class="lnm" marker-end="url(#am)"/>
  <text x="790" y="424" class="e" text-anchor="middle">cue coverage is part</text>
  <text x="790" y="442" class="e" text-anchor="middle">of adding one</text>
  <line x1="191.0" y1="110.0" x2="191.0" y2="214.0" class="lnm" marker-end="url(#am)"/>
  <text x="202" y="172" class="e" text-anchor="start">the device it runs on</text>
  <line x1="667.0" y1="110.0" x2="667.0" y2="214.0" class="lnm" marker-end="url(#am)"/>
  <text x="656" y="172" class="e" text-anchor="end">no generation in the path</text>
  <line x1="578.1" y1="110.0" x2="279.9" y2="214.0" class="lnm" marker-end="url(#am)"/>
  <text x="436.9" y="188.7" class="e" text-anchor="middle">frame-rate floor</text>
  <line x1="235.4" y1="276.0" x2="384.6" y2="380.0" class="lnm" marker-end="url(#am)"/>
  <text x="300" y="330" class="e" text-anchor="end">topology bounds the rules</text>
  <line x1="622.6" y1="276.0" x2="473.4" y2="380.0" class="lnm" marker-end="url(#am)"/>
  <text x="558" y="330" class="e" text-anchor="start">a code, not a score</text>
  <line x1="429.0" y1="442.0" x2="429.0" y2="546.0" class="lnm" marker-end="url(#am)"/>
  <text x="440" y="500" class="e" text-anchor="start">constraints are data</text>
  <rect x="560" y="48" width="214" height="62" rx="4" class="boxd"/>
  <text x="667.0" y="76.0" class="tb" text-anchor="middle">3.4.1  Response-time budget</text>
  <text x="667.0" y="94.0" class="s" text-anchor="middle">a requirement, not a decision</text>
  <rect x="84" y="48" width="214" height="62" rx="4" class="boxd"/>
  <text x="191.0" y="76.0" class="tb" text-anchor="middle">4.1  Platform and device</text>
  <text x="191.0" y="94.0" class="s" text-anchor="middle">a constraint, not a decision</text>
  <rect x="84" y="214" width="214" height="62" rx="4" class="boxp"/>
  <text x="191.0" y="242.0" class="tb" text-anchor="middle">4.2  Pose estimation engine</text>
  <text x="191.0" y="260.0" class="s" text-anchor="middle">MoveNet Lightning, on the GPU</text>
  <rect x="560" y="214" width="214" height="62" rx="4" class="boxp"/>
  <text x="667.0" y="242.0" class="tb" text-anchor="middle">4.4  Immediate feedback path</text>
  <text x="667.0" y="260.0" class="s" text-anchor="middle">a pre-authored cue bank</text>
  <rect x="84" y="380" width="214" height="62" rx="4" class="boxp"/>
  <text x="191.0" y="408.0" class="tb" text-anchor="middle">4.3  Client and stack</text>
  <text x="191.0" y="426.0" class="s" text-anchor="middle">Kotlin, on device, synced</text>
  <rect x="322" y="380" width="214" height="62" rx="4" class="boxp"/>
  <text x="429.0" y="408.0" class="tb" text-anchor="middle">4.5  Assessment approach</text>
  <text x="429.0" y="426.0" class="s" text-anchor="middle">declared constraints</text>
  <rect x="322" y="546" width="214" height="62" rx="4" class="boxp"/>
  <text x="429.0" y="574.0" class="tb" text-anchor="middle">4.6  Extensibility mechanism</text>
  <text x="429.0" y="592.0" class="s" text-anchor="middle">one specification file</text>
  <text x="42" y="656" class="cap" text-anchor="start">An arrow reads: the decision at its tail bounds the decision at its head.</text>

</svg>
