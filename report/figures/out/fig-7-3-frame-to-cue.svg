<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" width="1240" height="880">
  <style>
  text { font-family: Segoe UI, Calibri, Helvetica Neue, Arial, sans-serif; fill: #16323D; }
  .t    { font-size: 15px; }
  .tb   { font-size: 15px; font-weight: 600; }
  .s    { font-size: 12.5px; fill: #4A646F; }
  .sb   { font-size: 12.5px; font-weight: 600; fill: #4A646F; }
  .e    { font-size: 12.5px; fill: #4A646F; }
  .h    { font-size: 16px; font-weight: 600; }
  .m    { font-family: Consolas, DejaVu Sans Mono, Courier New, monospace; font-size: 12.5px; }
  .mb   { font-family: Consolas, DejaVu Sans Mono, Courier New, monospace; font-size: 12.5px; font-weight: 600; }
  .cap  { font-size: 12.5px; fill: #4A646F; font-style: italic; }
  .box  { fill: #F2F7F9;  stroke: #16323D;    stroke-width: 1.4; }
  .boxw { fill: #FDF0EB;  stroke: #E8663C;  stroke-width: 1.4; }
  .boxp { fill: #FFFFFF; stroke: #16323D;    stroke-width: 1.4; }
  .boxq { fill: #FFFFFF; stroke: #C7D6DC;   stroke-width: 1.4; }
  .boxd { fill: none;    stroke: #4A646F;  stroke-width: 1.2; stroke-dasharray: 5 4; }
  .boxk { fill: #16323D;   stroke: #16323D;    stroke-width: 1.4; }
  .reg  { fill: none;    stroke: #C7D6DC;   stroke-width: 1.2; }
  .ln   { stroke: #16323D;   stroke-width: 1.4; fill: none; }
  .lnm  { stroke: #4A646F; stroke-width: 1.2; fill: none; }
  .lnh  { stroke: #C7D6DC;  stroke-width: 1.2; fill: none; }
  .lna  { stroke: #E8663C; stroke-width: 1.6; fill: none; }
  .lnd  { stroke: #4A646F; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  .life { stroke: #C7D6DC;  stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#16323D"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4A646F"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#E8663C"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5,0.8 L10,5 L0.5,9.2" fill="none" stroke="#4A646F" stroke-width="1.5"/></marker>
    <marker id="tri" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0.5,0.6 L10,5 L0.5,9.4 z" fill="#FFFFFF" stroke="#16323D" stroke-width="1.2"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>
  <rect x="16.0" y="56" width="176" height="52" rx="4" class="boxp"/>
  <text x="104.0" y="79.0" class="tb" text-anchor="middle">CameraX</text>
  <text x="104.0" y="97.0" class="s" text-anchor="middle">analysis thread</text>
  <line x1="104" y1="108" x2="104" y2="766" class="life"/>
  <rect x="240.0" y="56" width="176" height="44" rx="4" class="boxp"/>
  <text x="328.0" y="83.0" class="tb" text-anchor="middle">SessionViewModel</text>
  <line x1="328" y1="100" x2="328" y2="766" class="life"/>
  <rect x="468.0" y="56" width="176" height="52" rx="4" class="boxp"/>
  <text x="556.0" y="79.0" class="tb" text-anchor="middle">PoseEngine</text>
  <text x="556.0" y="97.0" class="s" text-anchor="middle">worker thread</text>
  <line x1="556" y1="108" x2="556" y2="766" class="life"/>
  <rect x="696.0" y="56" width="176" height="44" rx="4" class="boxp"/>
  <text x="784.0" y="83.0" class="tb" text-anchor="middle">AssessmentSession</text>
  <line x1="784" y1="100" x2="784" y2="766" class="life"/>
  <rect x="887.0" y="56" width="176" height="44" rx="4" class="boxp"/>
  <text x="975.0" y="83.0" class="tb" text-anchor="middle">TriggerPolicy</text>
  <line x1="975" y1="100" x2="975" y2="766" class="life"/>
  <rect x="1088.0" y="56" width="128" height="52" rx="4" class="boxp"/>
  <text x="1152.0" y="79.0" class="tb" text-anchor="middle">CuePlayer</text>
  <text x="1152.0" y="97.0" class="s" text-anchor="middle">mixer thread</text>
  <line x1="1152" y1="108" x2="1152" y2="766" class="life"/>
  <line x1="104" y1="150" x2="328" y2="150" class="ln" marker-end="url(#a)"/>
  <text x="216.0" y="142" class="s" text-anchor="middle">analyse(image, t)</text>
  <line x1="328" y1="196" x2="556" y2="196" class="ln" marker-end="url(#a)"/>
  <text x="442.0" y="188" class="s" text-anchor="middle">submit(bitmap, t, rotation)</text>
  <line x1="556" y1="232" x2="328" y2="232" class="lnd" marker-end="url(#a)"/>
  <text x="442.0" y="224" class="s" text-anchor="middle">accepted, or dropped if busy</text>
  <line x1="556" y1="292" x2="328" y2="292" class="ln" marker-end="url(#a)"/>
  <text x="442.0" y="284" class="s" text-anchor="middle">onResult(landmarks, t)</text>
  <path d="M 328 322 H 400 V 348 H 330" class="ln" marker-end="url(#a)"/>
  <text x="412" y="339.0" class="s" text-anchor="start">FrameAdapter.fromReadings(...): Frame</text>
  <line x1="328" y1="396" x2="784" y2="396" class="ln" marker-end="url(#a)"/>
  <text x="556.0" y="388" class="s" text-anchor="middle">onFrame(frame)</text>
  <path d="M 784 426 H 856 V 452 H 786" class="ln" marker-end="url(#a)"/>
  <text x="868" y="443.0" class="s" text-anchor="start">segment, measure, evaluate</text>
  <line x1="784" y1="500" x2="975" y2="500" class="ln" marker-end="url(#a)"/>
  <text x="879.5" y="492" class="s" text-anchor="middle">select(raised, now, confidence)</text>
  <rect x="232" y="536" width="952" height="212" class="boxd"/>
  <rect x="232" y="536" width="46" height="22" class="boxd"/>
  <text x="255" y="552" class="sb" text-anchor="middle">alt</text>
  <text x="290" y="552" class="s" text-anchor="start">a cue survives every limit</text>
  <line x1="975" y1="584" x2="784" y2="584" class="lnd" marker-end="url(#a)"/>
  <text x="879.5" y="576" class="s" text-anchor="middle">SpokenCue</text>
  <line x1="784" y1="620" x2="328" y2="620" class="lnd" marker-end="url(#a)"/>
  <text x="556.0" y="612" class="s" text-anchor="middle">SessionUpdate, carrying the cue</text>
  <line x1="328" y1="656" x2="1152" y2="656" class="ln" marker-end="url(#a)"/>
  <text x="740.0" y="648" class="s" text-anchor="middle">play(asset)</text>
  <line x1="232" y1="676" x2="1184" y2="676" class="lnd"/>
  <text x="244" y="696" class="s" text-anchor="start">no cue: floor, budget, gap, debounce or repeat</text>
  <line x1="975" y1="728" x2="784" y2="728" class="lnd" marker-end="url(#a)"/>
  <text x="879.5" y="720" class="s" text-anchor="middle">null</text>
  <text x="60" y="800" class="e" text-anchor="start">The fault is raised and written to the session record in both branches. Only the last message differs.</text>
  <text x="44" y="858" class="cap" text-anchor="start">Dashed arrows are returns. The engine answers on its own thread, so the submission and the result it triggers belong to different frames in flight.</text>

</svg>
