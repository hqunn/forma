  <text x="368" y="210" class="m" text-anchor="start">framingSatisfied(frame)</text>
  <text x="368" y="230" class="m" text-anchor="start">startNewSet()</text>
  <text x="368" y="250" class="m" text-anchor="start">faultLog</text>
