  <text x="487.0" y="323" class="tb" text-anchor="middle">Segmenter</text>
  <line x1="356" y1="334" x2="618" y2="334" stroke="#16323D" stroke-width="1.2"/>
  <text x="368" y="358" class="m" text-anchor="start">onFrame(value, t)</text>
  <text x="368" y="378" class="m" text-anchor="start">: SegmentUpdate</text>
  <rect x="356" y="420" width="262" height="94" class="boxp"/>
  <text x="487.0" y="443" class="tb" text-anchor="middle">FaultEvaluator</text>
  <line x1="356" y1="454" x2="618" y2="454" stroke="#16323D" stroke-width="1.2"/>
  <text x="368" y="478" class="m" text-anchor="start">onFrame(frame, phase)</text>
  <text x="368" y="498" class="m" text-anchor="start">: List&lt;RaisedFault&gt;</text>
  <rect x="356" y="540" width="262" height="114" class="boxp"/>
  <text x="487.0" y="563" class="tb" text-anchor="middle">TriggerPolicy</text>
  <line x1="356" y1="574" x2="618" y2="574" stroke="#16323D" stroke-width="1.2"/>
  <text x="368" y="598" class="m" text-anchor="start">select(raised, now, conf)</text>
  <text x="368" y="618" class="m" text-anchor="start">: SpokenCue?</text>
  <text x="368" y="638" class="m" text-anchor="start">suppressed</text>
  <rect x="356" y="690" width="262" height="112" class="boxp"/>
  <text x="487.0" y="710" class="s" text-anchor="middle">«data»</text>
  <text x="487.0" y="732" class="tb" text-anchor="middle">RepOutcome</text>
  <line x1="356" y1="742" x2="618" y2="742" stroke="#16323D" stroke-width="1.2"/>
  <text x="368" y="766" class="m" text-anchor="start">rep, extremes</text>
  <text x="368" y="786" class="m" text-anchor="start">raised: Set&lt;String&gt;</text>
  <rect x="692" y="132" width="262" height="134" class="boxp"/>
  <text x="823.0" y="155" class="tb" text-anchor="middle">SessionViewModel</text>
  <line x1="692" y1="166" x2="954" y2="166" stroke="#16323D" stroke-width="1.2"/>
  <text x="704" y="190" class="m" text-anchor="start">begin(context, spec)</text>
  <text x="704" y="210" class="m" text-anchor="start">onFrame(bitmap, rotation)</text>
  <text x="704" y="230" class="m" text-anchor="start">startSet() / endSet()</text>
  <text x="704" y="250" class="m" text-anchor="start">state: AppState</text>
  <rect x="692" y="316" width="262" height="94" class="boxp"/>
  <text x="823.0" y="339" class="tb" text-anchor="middle">PoseEngine</text>
  <line x1="692" y1="350" x2="954" y2="350" stroke="#16323D" stroke-width="1.2"/>
  <text x="704" y="374" class="m" text-anchor="start">submit(bitmap, t, rotation)</text>
  <text x="704" y="394" class="m" text-anchor="start">close()</text>
  <rect x="692" y="436" width="262" height="112" class="boxp"/>
  <text x="823.0" y="456" class="s" text-anchor="middle">«object»</text>
  <text x="823.0" y="478" class="tb" text-anchor="middle">FrameAdapter</text>
  <line x1="692" y1="488" x2="954" y2="488" stroke="#16323D" stroke-width="1.2"/>
  <text x="704" y="512" class="m" text-anchor="start">fromReadings(...): Frame</text>
  <text x="704" y="532" class="m" text-anchor="start">letterbox(), unpad()</text>
  <rect x="692" y="596" width="262" height="94" class="boxp"/>
  <text x="823.0" y="619" class="tb" text-anchor="middle">CuePlayer</text>
  <line x1="692" y1="630" x2="954" y2="630" stroke="#16323D" stroke-width="1.2"/>
  <text x="704" y="654" class="m" text-anchor="start">preload(assets)</text>
  <text x="704" y="674" class="m" text-anchor="start">play(asset): Long?</text>
  <rect x="692" y="716" width="262" height="94" class="boxp"/>
  <text x="823.0" y="739" class="tb" text-anchor="middle">Narrator, StageTones</text>
  <line x1="692" y1="750" x2="954" y2="750" stroke="#16323D" stroke-width="1.2"/>
  <text x="704" y="774" class="m" text-anchor="start">say(asset): Boolean</text>
  <text x="704" y="794" class="m" text-anchor="start">framed(), ready(), ...</text>
  <text x="590" y="856" class="cap" text-anchor="middle">Solid: what one frame does, in the order drawn.  Dashed: uses.  Both edges crossing the module boundary point left, and the build makes the reverse impossible.</text>

</svg>
