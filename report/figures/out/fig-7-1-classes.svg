  <rect x="60" y="132" width="262" height="152" class="boxp"/>
  <text x="191.0" y="152" class="s" text-anchor="middle">«data»</text>
  <text x="191.0" y="174" class="tb" text-anchor="middle">ExerciseSpec</text>
  <line x1="60" y1="184" x2="322" y2="184" stroke="#16323D" stroke-width="1.2"/>
  <text x="72" y="208" class="m" text-anchor="start">landmarks, phases</text>
  <text x="72" y="228" class="m" text-anchor="start">repDriver, smoothing</text>
  <text x="72" y="248" class="m" text-anchor="start">faults, cues, trigger</text>
  <text x="72" y="268" class="m" text-anchor="start">framing, excludedFaults</text>
  <rect x="60" y="316" width="262" height="112" class="boxp"/>
  <text x="191.0" y="336" class="s" text-anchor="middle">«object»</text>
  <text x="191.0" y="358" class="tb" text-anchor="middle">SpecLoader</text>
  <line x1="60" y1="368" x2="322" y2="368" stroke="#16323D" stroke-width="1.2"/>
  <text x="72" y="392" class="m" text-anchor="start">load(text): ExerciseSpec</text>
  <text x="72" y="412" class="m" text-anchor="start">11 validation rules</text>
  <rect x="60" y="452" width="262" height="132" class="boxp"/>
  <text x="191.0" y="472" class="s" text-anchor="middle">«object»</text>
  <text x="191.0" y="494" class="tb" text-anchor="middle">Measurements</text>
  <line x1="60" y1="504" x2="322" y2="504" stroke="#16323D" stroke-width="1.2"/>
  <text x="72" y="528" class="m" text-anchor="start">evaluate(m, frame): Double?</text>
  <text x="72" y="548" class="m" text-anchor="start">explain(m, frame)</text>
  <text x="72" y="568" class="m" text-anchor="start">eight functions</text>
  <rect x="60" y="620" width="262" height="112" class="boxp"/>
  <text x="191.0" y="640" class="s" text-anchor="middle">«object»</text>
  <text x="191.0" y="662" class="tb" text-anchor="middle">Landmarks</text>
  <line x1="60" y1="672" x2="322" y2="672" stroke="#16323D" stroke-width="1.2"/>
  <text x="72" y="696" class="m" text-anchor="start">indexOf(name): Int</text>
  <text x="72" y="716" class="m" text-anchor="start">mirror(name): String</text>
