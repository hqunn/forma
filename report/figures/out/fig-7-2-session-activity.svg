<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880">
  <style>
  text { font-family: Segoe UI, Calibri, Helvetica Neue, Arial, sans-serif; fill: #16323D; }
  .t    { font-size: 15px; }
  .tb   { font-size: 15px; font-weight: 600; }
  .s    { font-size: 12.5px; fill: #4A646F; }
  .sb   { font-size: 12.5px; font-weight: 600; fill: #4A646F; }
  .e    { font-size: 12.5px; fill: #4A646F; }
  .h    { font-size: 16px; font-weight: 600; }
  .m    { font-family: Consolas, DejaVu Sans Mono, Courier New, monospace; font-size: 12.5px; }
  .mb   { font-family: Consolas, DejaVu Sans Mono, Courier New, monospace; font-size: 12.5px; font-weight: 600; }
  .cap  { font-size: 12.5px; fill: #4A646F; font-style: italic; }
  .box  { fill: #F2F7F9;  stroke: #16323D;    stroke-width: 1.4; }
  .boxw { fill: #FDF0EB;  stroke: #E8663C;  stroke-width: 1.4; }
  .boxp { fill: #FFFFFF; stroke: #16323D;    stroke-width: 1.4; }
  .boxq { fill: #FFFFFF; stroke: #C7D6DC;   stroke-width: 1.4; }
  .boxd { fill: none;    stroke: #4A646F;  stroke-width: 1.2; stroke-dasharray: 5 4; }
  .boxk { fill: #16323D;   stroke: #16323D;    stroke-width: 1.4; }
  .reg  { fill: none;    stroke: #C7D6DC;   stroke-width: 1.2; }
  .ln   { stroke: #16323D;   stroke-width: 1.4; fill: none; }
  .lnm  { stroke: #4A646F; stroke-width: 1.2; fill: none; }
  .lnh  { stroke: #C7D6DC;  stroke-width: 1.2; fill: none; }
  .lna  { stroke: #E8663C; stroke-width: 1.6; fill: none; }
  .lnd  { stroke: #4A646F; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  .life { stroke: #C7D6DC;  stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#16323D"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4A646F"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#E8663C"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5,0.8 L10,5 L0.5,9.2" fill="none" stroke="#4A646F" stroke-width="1.5"/></marker>
    <marker id="tri" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0.5,0.6 L10,5 L0.5,9.4 z" fill="#FFFFFF" stroke="#16323D" stroke-width="1.2"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="880" fill="#FFFFFF"/>
  <circle cx="420" cy="48" r="11" fill="#16323D"/>
  <line x1="420" y1="59" x2="420" y2="89" class="ln" marker-end="url(#a)"/>
  <rect x="260.0" y="89" width="320" height="56" rx="4" class="box"/>
  <text x="420.0" y="114.0" class="tb" text-anchor="middle">Choose an exercise</text>
  <text x="420.0" y="132.0" class="s" text-anchor="middle">the specification is loaded and validated</text>
  <line x1="420" y1="145" x2="420" y2="175" class="ln" marker-end="url(#a)"/>
  <rect x="260.0" y="175" width="320" height="56" rx="4" class="box"/>
  <text x="420.0" y="200.0" class="tb" text-anchor="middle">Show how the exercise is done</text>
  <text x="420.0" y="218.0" class="s" text-anchor="middle">the first time, and on request after that</text>
  <line x1="420" y1="231" x2="420" y2="261" class="ln" marker-end="url(#a)"/>
  <rect x="260.0" y="261" width="320" height="56" rx="4" class="box"/>
  <text x="420.0" y="286.0" class="tb" text-anchor="middle">Report the framing</text>
  <text x="420.0" y="304.0" class="s" text-anchor="middle">on screen and out loud; it advises, it does not refuse</text>
  <line x1="420" y1="317" x2="420" y2="347" class="ln" marker-end="url(#a)"/>
  <rect x="260.0" y="347" width="320" height="56" rx="4" class="box"/>
  <text x="420.0" y="372.0" class="tb" text-anchor="middle">Wait for the user to start</text>
  <text x="420.0" y="390.0" class="s" text-anchor="middle">they decide: the start control is always live</text>
  <line x1="420" y1="403" x2="420" y2="433" class="ln" marker-end="url(#a)"/>
  <rect x="260.0" y="433" width="320" height="56" rx="4" class="boxw"/>
  <text x="420.0" y="458.0" class="tb" text-anchor="middle">Assess one frame</text>
  <text x="420.0" y="476.0" class="s" text-anchor="middle">segment, measure, evaluate, decide</text>
  <line x1="420" y1="489" x2="420" y2="519" class="ln" marker-end="url(#a)"/>
  <path d="M420 519.0 L550.0 565.0 L420 611.0 L290.0 565.0 z" class="boxp"/>
  <text x="420" y="570.0" class="tb" text-anchor="middle">Set ended?</text>
  <text x="430" y="514.0" class="s" text-anchor="start">yes</text>
  <line x1="420" y1="611" x2="420" y2="641" class="ln" marker-end="url(#a)"/>
  <rect x="260.0" y="641" width="320" height="56" rx="4" class="box"/>
  <text x="420.0" y="666.0" class="tb" text-anchor="middle">Summarise and store</text>
  <text x="420.0" y="684.0" class="s" text-anchor="middle">every fault raised, spoken or not</text>
  <line x1="420" y1="697" x2="420" y2="727" class="ln" marker-end="url(#a)"/>
  <rect x="260.0" y="727" width="320" height="56" rx="4" class="boxp"/>
  <text x="420.0" y="752.0" class="tb" text-anchor="middle">Synchronise when connected</text>
  <text x="420.0" y="770.0" class="s" text-anchor="middle">between sets, never during one</text>
  <line x1="420" y1="783" x2="420" y2="797" class="ln" marker-end="url(#a)"/>
  <circle cx="420" cy="810" r="13" fill="none" stroke="#16323D" stroke-width="1.6"/>
  <circle cx="420" cy="810" r="8" fill="#16323D"/>
  <path d="M 550 565 H 580 V 461 H 580" class="ln" marker-end="url(#a)"/>
  <text x="590" y="513.0" class="s" text-anchor="start">no: next frame</text>
  <text x="42" y="866" class="cap" text-anchor="start">The shaded step is the only one with a deadline. Everything above it happens before the set and is allowed to take as long as it needs.</text>

</svg>
