<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <style>
  text { font-family: Segoe UI, Calibri, Helvetica Neue, Arial, sans-serif; fill: #16323D; }
  .t    { font-size: 15px; }
  .tb   { font-size: 15px; font-weight: 600; }
  .s    { font-size: 12.5px; fill: #4A646F; }
  .sb   { font-size: 12.5px; font-weight: 600; fill: #4A646F; }
  .e    { font-size: 12.5px; fill: #4A646F; }
  .h    { font-size: 16px; font-weight: 600; }
  .m    { font-family: Consolas, DejaVu Sans Mono, Courier New, monospace; font-size: 12.5px; }
  .mb   { font-family: Consolas, DejaVu Sans Mono, Courier New, monospace; font-size: 12.5px; font-weight: 600; }
  .cap  { font-size: 12.5px; fill: #4A646F; font-style: italic; }
  .box  { fill: #F2F7F9;  stroke: #16323D;    stroke-width: 1.4; }
  .boxw { fill: #FDF0EB;  stroke: #E8663C;  stroke-width: 1.4; }
  .boxp { fill: #FFFFFF; stroke: #16323D;    stroke-width: 1.4; }
  .boxq { fill: #FFFFFF; stroke: #C7D6DC;   stroke-width: 1.4; }
  .boxd { fill: none;    stroke: #4A646F;  stroke-width: 1.2; stroke-dasharray: 5 4; }
  .boxk { fill: #16323D;   stroke: #16323D;    stroke-width: 1.4; }
  .reg  { fill: none;    stroke: #C7D6DC;   stroke-width: 1.2; }
  .ln   { stroke: #16323D;   stroke-width: 1.4; fill: none; }
  .lnm  { stroke: #4A646F; stroke-width: 1.2; fill: none; }
  .lnh  { stroke: #C7D6DC;  stroke-width: 1.2; fill: none; }
  .lna  { stroke: #E8663C; stroke-width: 1.6; fill: none; }
  .lnd  { stroke: #4A646F; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  .life { stroke: #C7D6DC;  stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#16323D"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4A646F"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#E8663C"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5,0.8 L10,5 L0.5,9.2" fill="none" stroke="#4A646F" stroke-width="1.5"/></marker>
    <marker id="tri" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0.5,0.6 L10,5 L0.5,9.4 z" fill="#FFFFFF" stroke="#16323D" stroke-width="1.2"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="620" fill="#FFFFFF"/>
  <rect x="40" y="40" width="560" height="520" rx="3" class="boxp"/>
  <text x="56" y="64" class="s" text-anchor="start">«device»</text>
  <text x="56" y="84" class="tb" text-anchor="start">Android handset</text>
  <rect x="800" y="320" width="240" height="240" rx="3" class="boxp"/>
  <text x="816" y="344" class="s" text-anchor="start">«service»</text>
  <text x="816" y="364" class="tb" text-anchor="start">FORMA server</text>
  <text x="72" y="110" class="sb" text-anchor="start">LIVE PATH</text>
  <text x="400" y="110" class="sb" text-anchor="start">RECORD</text>
  <rect x="72" y="120" width="290" height="56" rx="4" class="box"/>
  <text x="217.0" y="145.0" class="tb" text-anchor="middle">Capture</text>
  <text x="217.0" y="163.0" class="s" text-anchor="middle">frames, each timestamped</text>
  <rect x="72" y="198" width="290" height="56" rx="4" class="box"/>
  <text x="217.0" y="223.0" class="tb" text-anchor="middle">Pose estimation</text>
  <text x="217.0" y="241.0" class="s" text-anchor="middle">one model, fixed configuration</text>
  <rect x="72" y="276" width="290" height="56" rx="4" class="box"/>
  <text x="217.0" y="301.0" class="tb" text-anchor="middle">Adaptation</text>
  <text x="217.0" y="319.0" class="s" text-anchor="middle">engine output to frame type</text>
  <rect x="72" y="354" width="290" height="56" rx="4" class="box"/>
  <text x="217.0" y="379.0" class="tb" text-anchor="middle">Assessment</text>
  <text x="217.0" y="397.0" class="s" text-anchor="middle">segment, measure, judge</text>
  <rect x="72" y="432" width="290" height="56" rx="4" class="box"/>
  <text x="217.0" y="457.0" class="tb" text-anchor="middle">Feedback output</text>
  <text x="217.0" y="475.0" class="s" text-anchor="middle">fault code to spoken cue</text>
  <line x1="217.0" y1="176" x2="217.0" y2="198" class="ln" marker-end="url(#a)"/>
  <line x1="217.0" y1="254" x2="217.0" y2="276" class="ln" marker-end="url(#a)"/>
  <line x1="217.0" y1="332" x2="217.0" y2="354" class="ln" marker-end="url(#a)"/>
  <line x1="217.0" y1="410" x2="217.0" y2="432" class="ln" marker-end="url(#a)"/>
  <text x="72" y="522" class="e" text-anchor="start">No network call, file read or model load on this path.</text>
  <rect x="400" y="354" width="170" height="56" rx="4" class="boxp"/>
  <text x="485.0" y="379.0" class="tb" text-anchor="middle">Local record</text>
  <text x="485.0" y="397.0" class="s" text-anchor="middle">sessions, reps, faults</text>
  <rect x="400" y="482" width="170" height="56" rx="4" class="boxp"/>
  <text x="485.0" y="507.0" class="tb" text-anchor="middle">Synchronisation</text>
  <text x="485.0" y="525.0" class="s" text-anchor="middle">between sets only</text>
  <line x1="362" y1="382" x2="400" y2="382" class="ln" marker-end="url(#a)"/>
  <line x1="485.0" y1="410" x2="485.0" y2="482" class="ln" marker-end="url(#a)"/>
  <line x1="570" y1="510" x2="800" y2="510" class="lnd" marker-end="url(#a)"/>
  <text x="685" y="496" class="s" text-anchor="middle">records only</text>
  <text x="685" y="528" class="s" text-anchor="middle">no frames or landmarks</text>
  <rect x="820" y="380" width="200" height="44" rx="4" class="boxq"/>
  <text x="920.0" y="399.0" class="t" text-anchor="middle">Account</text>
  <text x="920.0" y="417.0" class="s" text-anchor="middle">sign in</text>
  <rect x="820" y="434" width="200" height="44" rx="4" class="boxq"/>
  <text x="920.0" y="453.0" class="t" text-anchor="middle">Session store</text>
  <text x="920.0" y="471.0" class="s" text-anchor="middle">durable history</text>
  <rect x="820" y="488" width="200" height="44" rx="4" class="boxq"/>
  <text x="920.0" y="507.0" class="t" text-anchor="middle">Reconciliation</text>
  <text x="920.0" y="525.0" class="s" text-anchor="middle">including deletions</text>
  <text x="42" y="596" class="cap" text-anchor="start">The shaded column is the live path. It runs entirely inside one process on the handset; the dashed line is the only crossing, and it never runs during a set.</text>

</svg>
